services:
  mongodb:
    image: mongo:8.0
    container_name: deepa-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-deepa}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-deepa_pass}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-deepa}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - deepa-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  deepa-net:
    name: deepa-net

volumes:
  mongodb-data:
    name: deepa-mongodb-data